<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード変更 | 会議室予約</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <main class="auth-title">
        <h1 class="auth-title">パスワード変更</h1>
        <p class="auth-note">初回ログインのため、新しいパスワードを設定してください。</p>

        <form id="passwordForm" class="auth-form">
            <label>現在のパスワード
                <input type="password" id="currentPassword" required autocomplete="current-password">
            </label>
            <label>新しいパスワード（８文字以上）
                <input type="password" id="newPassword" required minlength="8" autocomplete="new-password">
            </label>
            <label>新しいパスワード（確認）
                <input type="password" id="confirmPassword" required minlength="8" autocomplete="new-password">
            </label>
            <p id="passwordError" class="form-error"></p>
            <button type="submit" class="btn-primary">変更する</button>
        </form>
    </main>

    <script src="js/change-password.js"></script>
</body>
</html>
